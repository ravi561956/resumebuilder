<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Auth{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #8adf4eab, #2260be);
      min-height: 100vh;
    }
    .reset-wrapper{
      text-align:center;
  }

  .reset-icon{
      width:90px;
      margin-bottom:20px;
  }

  .reset-title{
      font-size:32px;
      font-weight:700;
      color:#224abe;
      margin-bottom:10px;
  }

  .reset-subtitle{
      color:#6c757d;
      margin-bottom:30px;
      font-size:15px;
  }

  .form-label{
      font-weight:600;
      margin-bottom:8px;
      display:block;
      text-align:left;
  }

  .form-control{
      border-radius:12px;
      min-height:50px;
      padding:12px 15px;
      border:1px solid #dcdcdc;
  }

  .form-control:focus{
      border-color:#4e73df;
      box-shadow:none;
  }

  .helptext{
      display:block;
      margin-top:8px;
      font-size:13px;
      color:#6c757d;
      text-align:left;
  }

  .helptext ul{
      padding-left:18px;
      margin-top:8px;
  }

  .errorlist{
      list-style:none;
      padding:0;
      margin-top:5px;
      margin-bottom:0;
      color:#dc3545;
      font-size:14px;
      text-align:left;
  }

  .btn-reset{

      width:100%;

      padding:12px;

      border:none;

      border-radius:12px;

      background:#4e73df;

      color:#fff;

      font-weight:600;

      transition:0.3s;
  }

  .btn-reset:hover{
      background:#224abe;
  }

  .footer-link{
      margin-top:20px;
      text-align:center;
      font-size:14px;
      color:#6c757d;
  }

  .footer-link a{
      text-decoration:none;
      font-weight:600;
  }
  </style>
</head>

<body>
<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">

      <a class="navbar-brand fw-bold" href="/">
          MySaaS
      </a>

      <div class="ms-auto">
          {% if user.is_authenticated %}
            <!-- Logged In -->           
            <div class="d-flex align-items-center gap-3">
              <span class="fw-semibold text-dark">
                <i class="fa-solid fa-user me-2"></i>
                  Hi, {{ user.username }} 👋
              </span>
          
              <a href="{% url 'logout_all_devices' %}"
                 class="text-decoration-none text-danger fw-semibold">
                  Logout
              </a>
          
          </div>
          {% else %}

              <!-- Guest -->

              <a href="/admin" class="btn btn-outline-primary me-2">
                  Login
              </a>

              <a href="{% url 'register' %}" class="btn btn-primary">
                  Sign Up
              </a>

          {% endif %}

      </div>

  </div>
</nav>
<div class="container d-flex align-items-center justify-content-center vh-100">
  <div class="col-md-5 bg-white p-4 rounded shadow">
    {% if messages %}
    {% for message in messages %}
      <p style="color: green;">{{ message }}</p>
    {% endfor %}
  {% endif %}
    {% block content %}{% endblock %}

  </div>
</div>
<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">
  <p class="mb-0">© 2026 MySaaS. All rights reserved.</p>
</footer>
</body>
</html>
