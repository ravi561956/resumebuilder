{% extends 'auth_base.html' %}

{% block content %}
<h4 class="mb-4 fw-bold">Reset Password</h4>

<form method="post">
  {% csrf_token %}

  <input type="email" name="email" class="form-control mb-3" placeholder="Enter your email">

  <button class="btn btn-primary w-100">Send OTP</button>
</form>
{% endblock %}
