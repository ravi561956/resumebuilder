{% extends "auth_base.html" %}

{% block title %}
Password Reset Successful
{% endblock %}

{% block extra_css %}
<style>

    .success-wrapper{
        text-align:center;
    }

    .success-icon{
        width:90px;
        margin-bottom:20px;
    }

    .success-title{
        font-size:32px;
        font-weight:700;
        color:#28a745;
        margin-bottom:12px;
    }

    .success-text{
        color:#6c757d;
        font-size:16px;
        line-height:1.7;
        margin-bottom:30px;
    }

    .btn-login-custom{

        display:inline-flex;
        align-items:center;
        justify-content:center;

        padding:12px 30px;

        background:#4e73df;

        color:#fff;

        border:none;

        border-radius:12px;

        text-decoration:none;

        font-weight:600;

        transition:0.3s;
    }

    .btn-login-custom:hover{
        background:#224abe;
        color:#fff;
    }

    .success-check{

        width:110px;
        height:110px;

        margin:0 auto 25px;

        display:flex;
        align-items:center;
        justify-content:center;

        background:rgba(40,167,69,0.12);

        border-radius:50%;
    }

    .success-check i{
        font-size:48px;
        color:#28a745;
    }

</style>
{% endblock %}

{% block content %}

<div class="success-wrapper">

    <div class="success-check">
        <i class="fa-solid fa-check"></i>
    </div>

    <h2 class="success-title">
        Password Reset Successful!
    </h2>

    <p class="success-text">
        Your password has been updated successfully.
        You can now login using your new password.
    </p>

    <a href="/login" class="btn-login-custom">

        <i class="fa-solid fa-right-to-bracket me-2"></i>

        Login Now

    </a>

</div>

{% endblock %}
