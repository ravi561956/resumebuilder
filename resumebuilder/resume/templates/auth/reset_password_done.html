{% extends 'auth_base.html' %}
{% block title %}Password Reset Sent{% endblock %}

{% block content %}

<div class="text-center">

  <!-- Icon -->
  <div class="mb-3">
    <i class="fas fa-envelope-circle-check fa-3x text-success"></i>
  </div>

  <!-- Heading -->
  <h4 class="fw-bold mb-2">Check your email</h4>

  <!-- Message -->
  <p class="text-muted">
    We’ve sent a password reset link to your email address.
    Please follow the instructions to reset your password.
  </p>

  <!-- Button -->
  <a href="/admin" class="btn btn-primary w-100 mt-3">
    Back to Login
  </a>

</div>

{% endblock %}
