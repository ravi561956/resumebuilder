<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OTP Verification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin:0;padding:0;background-color:#f4f6f8;">

  <table width="100%" cellpadding="0" cellspacing="0" style="padding:20px 0;">
    <tr>
      <td align="center">

        <!-- Container -->
        <table width="600" cellpadding="0" cellspacing="0"
               style="background:#ffffff;border-radius:8px;overflow:hidden;max-width:100%;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding:20px;">
              <img src="https://via.placeholder.com/120x40?text=Logo"
                   alt="Resume Builder"
                   width="120"
                   style="display:block;border:0;">
            </td>
          </tr>

          <!-- Header -->
          <tr>
            <td style="background:#4e73df;color:#ffffff;text-align:center;padding:15px;">
              <div style="font-size:20px;font-weight:bold;">Resume Builder</div>
              <div style="font-size:13px;opacity:0.9;">
                Build your professional identity
              </div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:30px;font-family:Arial,sans-serif;color:#333;">

              <p>Hi {{ user.get_username }},</p>

              <p>Your One-Time Password (OTP) is:</p>

              <!-- OTP BOX -->
              <table align="center" cellpadding="0" cellspacing="0" style="margin:25px auto;">
                <tr>
                  <td style="background:#f1f3f5;
                             padding:15px 25px;
                             font-size:28px;
                             letter-spacing:5px;
                             font-weight:bold;
                             color:#4e73df;
                             border-radius:6px;
                             text-align:center;">
                    {{ otp }}
                  </td>
                </tr>
              </table>

              <p style="text-align:center;font-size:14px;color:#666;">
                This code will expire in <strong>5 minutes</strong>.
              </p>

              <p style="margin-top:25px;font-size:14px;color:#777;">
                If you didn’t request this, please ignore this email.
              </p>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#f1f1f1;padding:20px;text-align:center;font-size:12px;color:#666;">
              <p style="margin:0;">Need help?</p>
              <p style="margin:5px 0;">
                <a href="mailto:support@yourdomain.com"
                   style="color:#4e73df;text-decoration:none;">
                   support@yourdomain.com
                </a>
              </p>

              <p style="margin-top:10px;">
                © {{ year|default:"2026" }} Resume Builder
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
