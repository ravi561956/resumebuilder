{% extends 'auth_base.html' %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-12">

    <div class="card shadow-sm p-4 text-center">

      <h4 class="mb-3 fw-bold">Verify OTP</h4>
      <p class="text-muted">Enter the OTP sent to your email</p>

      <!-- OTP Form -->
      <form method="post">
        {% csrf_token %}

        <input type="text"
               name="otp"
               maxlength="6"
               class="form-control mb-3 text-center fs-4"
               placeholder="••••••"
               required>

        <button class="btn btn-primary w-100">
          Verify
        </button>
      </form>

      <!-- Timer -->
      <p id="timer" class="mt-3 text-muted">
        Resend OTP in 5min
      </p>

      <!-- Resend Button -->
      <button id="resendBtn"
              class="btn btn-outline-secondary btn-sm"
              onclick="resendOTP()"
              disabled>
        Resend OTP
      </button>

    </div>

  </div>
</div>

<script>
  let timeLeft = 30;
  const timerEl = document.getElementById("timer");
  const btn = document.getElementById("resendBtn");

  const countdown = setInterval(() => {
    timeLeft--;
    timerEl.innerText = "Resend OTP in " + timeLeft + "s";

    if (timeLeft <= 0) {
      clearInterval(countdown);
      timerEl.innerText = "You can resend OTP now";
      btn.disabled = false;
    }
  }, 1000);

  function resendOTP() {
    fetch("/resend-otp/")
      .then(res => res.text())
      .then(data => {
        alert("OTP sent again!");

        // reset timer
        timeLeft = 30;
        btn.disabled = true;

        const newCountdown = setInterval(() => {
          timeLeft--;
          timerEl.innerText = "Resend OTP in " + timeLeft + "s";

          if (timeLeft <= 0) {
            clearInterval(newCountdown);
            timerEl.innerText = "You can resend OTP now";
            btn.disabled = false;
          }
        }, 1000);
      });
  }
</script>

{% endblock %}
