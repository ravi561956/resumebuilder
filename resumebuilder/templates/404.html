<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .error-page {
            text-align: center;
        }

        .error-code {
            font-size: 120px;
            font-weight: bold;
            margin: 0;
        }

        h1 {
            margin: 10px 0;
        }

        p {
            color: #666;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            background: #000;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <p class="error-code">404</p>
        <h1>Page Not Found</h1>
        <p>Sorry, the page you're looking for doesn't exist.</p>

        <a href="/">Go to Homepage</a>
    </div>
</body>
</html>
